<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Clever Sash Windows - Gallery</title>
  <style>
    :root {
      --bg-color: #333333;
      --card-bg: #f0ece1;
      --text-main: #000000;
      --text-muted: #666666;
      --accent: #3b82f6;
      --radius: 12px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-color); color: var(--text-main); font-family: system-ui, sans-serif; padding: 1rem; }
    .gallery-container { max-width: 1400px; margin: 0 auto; }
    
    .gallery-header { margin-bottom: 1.5rem; color: white; }
    .filter-group { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.75rem; scrollbar-width: none; }
    .filter-chip input { position: absolute; opacity: 0; }
    .filter-chip span {
      display: inline-block; padding: 0.5rem 1.25rem; background: var(--card-bg);
      border-radius: 50px; font-size: 0.9rem; cursor: pointer; border: 1px solid #333;
    }
    .filter-chip input:checked + span { background: var(--accent); color: white; border-color: var(--accent); }

    /* UNIFORM 2x2 GRID */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); 
      gap: 0.75rem;
    }

    .gallery-item {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      opacity: 0;
      animation: fadeIn 0.4s forwards;
      cursor: pointer;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    .img-container { 
      width: 100%; 
      aspect-ratio: 1 / 1; 
      overflow: hidden; 
      flex-shrink: 0; 
    }
    .img-container img { width: 100%; height: 100%; object-fit: cover; }

    .item-info { padding: 0.75rem; flex-grow: 1; display: flex; flex-direction: column; gap: 0.25rem; }
    .item-info h3 { font-size: 0.85rem; text-transform: capitalize; font-weight: 700; color: #111; }
    .item-info p { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

    /* LIGHTBOX */
    .lightbox {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); display: none; justify-content: center;
      align-items: center; z-index: 1000; padding: 1.5rem;
    }
    .lightbox.active { display: flex; }
    .lightbox-content { max-width: 1000px; width: 100%; background: var(--card-bg); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .lightbox img { max-height: 60vh; width: 100%; object-fit: contain; background: #000; }
    .lightbox-meta { padding: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .close-btn { align-self: flex-start; padding: 0.5rem 1rem; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }

    @media (min-width: 768px) {
      .gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
      .lightbox-content { flex-direction: row; height: 75vh; }
      .lightbox img { width: 65%; max-height: 100%; }
      .lightbox-meta { width: 35%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="gallery-container">
    <header class="gallery-header">
      <h2>Interactive Showroom</h2>
      <div id="filter-group" class="filter-group">
        <label class="filter-chip">
          <input type="checkbox" id="filter-all" checked>
          <span>All Items</span>
        </label>
      </div>
    </header>
    <main id="gallery-grid" class="gallery-grid"></main>
  </div>

  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="">
      <div class="lightbox-meta">
        <h3 id="lightbox-title"></h3>
        <p id="lightbox-tags" style="font-size: 0.8rem; color: #666;"></p>
        <button class="close-btn" onclick="closeLightbox()">Close Gallery</button>
      </div>
    </div>
  </div>

  <script>
    let galleryData = [];
    let filteredData = [];

    const cloudName = "boxcleversashwindows"; 
    const baseDeliveryUrl = `https://res.cloudinary.com/${cloudName}/image/upload/f_auto,q_auto/`;

    fetch('gallery.json')
      .then(res => res.json())
      .then(data => {
        galleryData = data.resources.map(resource => {
          const fileName = resource.public_id.split('/').pop();
          const rawFilenameLower = fileName.toLowerCase();
          
          const multiWordTags = ['front_elevation', 'street_view', 'bespoke_colour', 'close_up', 'sash_window'];
          const generatedTags = [];

          multiWordTags.forEach(combo => {
            if (rawFilenameLower.includes(combo)) {
              generatedTags.push(combo.replace(/_/g, ' ')); 
            }
          });

          const singleWords = rawFilenameLower.split('_').filter(word => {
            return word.length > 3 && !['bygone', 'harmony', 'part'].includes(word);
          });

          singleWords.forEach(word => {
            const isInsideCombo = multiWordTags.some(combo => combo.includes(word));
            if (!isInsideCombo) generatedTags.push(word);
          });

          return {
            id: resource.asset_id,
            title: fileName.replace(/_/g, ' '),
            tags: generatedTags.length > 0 ? generatedTags : ['general'],
            src: `${baseDeliveryUrl}v${resource.version}/${resource.public_id}.${resource.format}`
          };
        });

        filteredData = [...galleryData];
        generateFilters();
        renderGrid();
      });

    function generateFilters() {
      const allTags = new Set();
      galleryData.forEach(item => item.tags.forEach(t => allTags.add(t)));
      const container = document.getElementById('filter-group');
      allTags.forEach(tag => {
        const label = document.createElement('label');
        label.className = 'filter-chip';
        label.innerHTML = `<input type="checkbox" class="tag-cb" value="${tag}"><span>${tag}</span>`;
        container.appendChild(label);
      });
      setupFilterLogic();
    }

    function setupFilterLogic() {
      document.getElementById('filter-group').addEventListener('change', (e) => {
        const allCb = document.getElementById('filter-all');
        const tagCbs = document.querySelectorAll('.tag-cb');
        
        if (e.target === allCb) {
          tagCbs.forEach(cb => cb.checked = false);
        } else {
          allCb.checked = false;
        }

        const activeTags = Array.from(tagCbs).filter(cb => cb.checked).map(cb => cb.value);
        if (activeTags.length === 0) allCb.checked = true;

        filteredData = allCb.checked ? galleryData : galleryData.filter(item => 
          item.tags.some(t => activeTags.includes(t))
        );
        renderGrid();
      });
    }

    function renderGrid() {
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = filteredData.map(item => `
        <div class="gallery-item" onclick="openLightbox('${item.id}')">
          <div class="img-container"><img src="${item.src}" loading="lazy"></div>
          <div class="item-info">
            <h3>${item.title}</h3>
            <p>${item.tags.join(' • ')}</p>
          </div>
        </div>
      `).join('');
    }

    function openLightbox(id) {
      const item = galleryData.find(i => i.id === id);
      document.getElementById('lightbox-img').src = item.src;
      document.getElementById('lightbox-title').textContent = item.title;
      document.getElementById('lightbox-tags').textContent = item.tags.join(' • ');
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }
  </script>
</body>
</html>
