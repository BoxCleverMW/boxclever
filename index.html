<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Clever Sash Windows - Gallery</title>
  <style>
    :root {
      --bg-color: #333333;
      --card-bg: #f0ece1;
      --text-main: #000000;
      --text-muted: #666666;
      --brand-gold: #d6ba4c; /* Your requested Hex */
      --radius: 12px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-color); color: var(--text-main); font-family: system-ui, sans-serif; padding: 1rem; }
    .gallery-container { max-width: 1400px; margin: 0 auto; }
    
    .gallery-header { margin-bottom: 1.5rem; color: white; }
    
    /* 1. TAG BUTTONS STYLING */
    .filter-group { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.75rem; scrollbar-width: none; }
    .filter-chip input { position: absolute; opacity: 0; }
    .filter-chip span {
      display: inline-block; padding: 0.5rem 1.25rem; background: var(--card-bg);
      border-radius: 50px; font-size: 0.9rem; cursor: pointer; border: 1px solid #333;
      transition: var(--transition);
    }
    .filter-chip input:checked + span { 
      background: var(--brand-gold); 
      color: white; 
      border-color: var(--brand-gold); 
    }

    /* UNIFORM GRID */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); 
      gap: 0.75rem;
    }

    .gallery-item {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      opacity: 0;
      animation: fadeIn 0.4s forwards;
      cursor: pointer;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    .img-container { width: 100%; aspect-ratio: 1 / 1; overflow: hidden; flex-shrink: 0; }
    .img-container img { width: 100%; height: 100%; object-fit: cover; }

    .item-info { padding: 0.75rem; flex-grow: 1; display: flex; flex-direction: column; gap: 0.25rem; }
    .item-info h3 { font-size: 0.85rem; text-transform: capitalize; font-weight: 700; }
    .item-info p { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }

    /* LIGHTBOX & ARROWS */
    .lightbox {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); display: none; justify-content: center;
      align-items: center; z-index: 1000; padding: 1rem;
    }
    .lightbox.active { display: flex; }
    
    .lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.1); color: white; border: none;
      width: 50px; height: 50px; border-radius: 50%; font-size: 2rem;
      cursor: pointer; z-index: 1010; transition: 0.2s;
    }
    .lightbox-nav:hover { background: var(--brand-gold); }
    .nav-prev { left: 1rem; }
    .nav-next { right: 1rem; }

    .lightbox-content { 
      max-width: 1100px; width: 100%; background: var(--card-bg); 
      border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; 
      position: relative;
    }
    .lightbox img { max-height: 65vh; width: 100%; object-fit: contain; background: #000; }
    
    .lightbox-meta { padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    
    /* 2. EXTERNAL BUTTON STYLING */
    .btn-gold {
      display: inline-block; align-self: flex-start;
      padding: 0.75rem 1.5rem; background: var(--brand-gold); 
      color: white; text-decoration: none; border-radius: 6px;
      font-weight: 600; transition: opacity 0.2s;
    }
    .btn-gold:hover { opacity: 0.9; }
    
    .close-x { position: absolute; top: 10px; right: 15px; font-size: 2rem; cursor: pointer; color: white; z-index: 1020; }

    @media (min-width: 768px) {
      .gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
      .lightbox-content { flex-direction: row; height: 75vh; }
      .lightbox img { width: 65%; max-height: 100%; }
      .lightbox-meta { width: 35%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="gallery-container">
    <header class="gallery-header">
      <h2>Interactive Showroom</h2>
      <div id="filter-group" class="filter-group">
        <label class="filter-chip">
          <input type="checkbox" id="filter-all" checked>
          <span>All Items</span>
        </label>
      </div>
    </header>
    <main id="gallery-grid" class="gallery-grid"></main>
  </div>

  <div id="lightbox" class="lightbox">
    <span class="close-x" onclick="closeLightbox()">&times;</span>
    <button class="lightbox-nav nav-prev" onclick="changeImage(-1)">&#10094;</button>
    <button class="lightbox-nav nav-next" onclick="changeImage(1)">&#10095;</button>
    
    <div class="lightbox-content">
      <img id="lightbox-img" src="">
      <div class="lightbox-meta">
        <h3 id="lightbox-title"></h3>
        <p id="lightbox-tags" style="color: #666; font-size: 0.9rem;"></p>
        <a id="lightbox-external" href="#" target="_blank" class="btn-gold">Open Full Image &nearr;</a>
      </div>
    </div>
  </div>

  <script>
    let galleryData = [];
    let filteredData = [];
    let currentIndex = 0;

    const cloudName = "boxcleversashwindows"; 
    const baseDeliveryUrl = `https://res.cloudinary.com/${cloudName}/image/upload/f_auto,q_auto/`;

    fetch('gallery.json')
      .then(res => res.json())
      .then(data => {
        galleryData = data.resources.map(resource => {
          const fileName = resource.public_id.split('/').pop();
          const rawFilenameLower = fileName.toLowerCase();
          
          const multiWordTags = ['front_elevation', 'street_view', 'bespoke_colour', 'close_up', 'sash_window'];
          const generatedTags = [];

          multiWordTags.forEach(combo => {
            if (rawFilenameLower.includes(combo)) {
              generatedTags.push(combo.replace(/_/g, ' ')); 
            }
          });

          const singleWords = rawFilenameLower.split('_').filter(word => {
            return word.length > 3 && !['bygone', 'harmony', 'part'].includes(word);
          });

          singleWords.forEach(word => {
            const isInsideCombo = multiWordTags.some(combo => combo.includes(word));
            if (!isInsideCombo) generatedTags.push(word);
          });

          return {
            id: resource.asset_id,
            title: fileName.replace(/_/g, ' '),
            tags: generatedTags.length > 0 ? generatedTags : ['general'],
            src: `${baseDeliveryUrl}v${resource.version}/${resource.public_id}.${resource.format}`,
            rawSrc: `${baseDeliveryUrl.replace('f_auto,q_auto/', '')}v${resource.version}/${resource.public_id}.${resource.format}`
          };
        });

        filteredData = [...galleryData];
        generateFilters();
        renderGrid();
      });

    function generateFilters() {
      const allTags = new Set();
      galleryData.forEach(item => item.tags.forEach(t => allTags.add(t)));
      const container = document.getElementById('filter-group');
      allTags.forEach(tag => {
        const label = document.createElement('label');
        label.className = 'filter-chip';
        label.innerHTML = `<input type="checkbox" class="tag-cb" value="${tag}"><span>${tag}</span>`;
        container.appendChild(label);
      });
      setupFilterLogic();
    }

    function setupFilterLogic() {
      document.getElementById('filter-group').addEventListener('change', (e) => {
        const allCb = document.getElementById('filter-all');
        const tagCbs = document.querySelectorAll('.tag-cb');
        
        if (e.target === allCb) {
          tagCbs.forEach(cb => cb.checked = false);
        } else {
          allCb.checked = false;
        }

        const activeTags = Array.from(tagCbs).filter(cb => cb.checked).map(cb => cb.value);
        if (activeTags.length === 0) allCb.checked = true;

        filteredData = allCb.checked ? galleryData : galleryData.filter(item => 
          item.tags.some(t => activeTags.includes(t))
        );
        renderGrid();
      });
    }

    function renderGrid() {
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = filteredData.map((item, idx) => `
        <div class="gallery-item" onclick="openLightbox(${idx})">
          <div class="img-container"><img src="${item.src}" loading="lazy"></div>
          <div class="item-info">
            <h3>${item.title}</h3>
            <p>${item.tags.join(' • ')}</p>
          </div>
        </div>
      `).join('');
    }

    function openLightbox(index) {
      currentIndex = index;
      updateLightbox();
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function updateLightbox() {
      const item = filteredData[currentIndex];
      document.getElementById('lightbox-img').src = item.src;
      document.getElementById('lightbox-title').textContent = item.title;
      document.getElementById('lightbox-tags').textContent = item.tags.join(' • ');
      document.getElementById('lightbox-external').href = item.rawSrc;
    }

    function changeImage(step) {
      currentIndex += step;
      if (currentIndex >= filteredData.length) currentIndex = 0;
      if (currentIndex < 0) currentIndex = filteredData.length - 1;
      updateLightbox();
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === "ArrowRight") changeImage(1);
      if (e.key === "ArrowLeft") changeImage(-1);
      if (e.key === "Escape") closeLightbox();
    });
  </script>
</body>
</html>
