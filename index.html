<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Clever Sash Windows - Interactive Gallery Test</title>
  <style>
    :root {
      --bg-color: #333333;
      --card-bg: #f0ece1;
      --text-main: #000000;
      --text-muted: #666666;
      --accent: #3b82f6;
      --radius: 12px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background: var(--bg-color); 
      color: var(--text-main); 
      font-family: system-ui, -apple-system, sans-serif; 
      padding: 1rem; 
    }
    
    .gallery-container { max-width: 1400px; margin: 0 auto; }
    .gallery-header { margin-bottom: 1.5rem; padding-top: 1rem; }
    .gallery-header h2 { margin-bottom: 1.25rem; font-weight: 700; color: #fff; }

    /* Filter Chips */
    .filter-group {
      display: flex; gap: 0.5rem; overflow-x: auto;
      padding-bottom: 0.75rem; scrollbar-width: none;
    }
    .filter-group::-webkit-scrollbar { display: none; }

    .filter-chip input { position: absolute; opacity: 0; width: 0; height: 0; }
    .filter-chip span {
      display: inline-block; padding: 0.5rem 1.25rem;
      background: var(--card-bg); border-radius: 50px;
      font-size: 0.9rem; cursor: pointer; white-space: nowrap;
      border: 1px solid #333; transition: var(--transition);
    }
    .filter-chip input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* 1. THE GRID - Forced 2-column on mobile */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); 
      gap: 0.75rem;
    }

    /* 2. THE CARD - Universal Behavior */
    .gallery-item {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      opacity: 0;
      animation: cardFadeIn 0.4s ease forwards;
    }
    
    @keyframes cardFadeIn { to { opacity: 1; } }
    .gallery-item:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }

    /* 3. THE IMAGE - Uniform Cropped Squares */
    .img-container { 
      width: 100%; 
      aspect-ratio: 1 / 1; 
      overflow: hidden; 
      background: #2a2a2a;
      flex-shrink: 0;
    }
    .img-container img { 
      width: 100%; height: 100%; object-fit: cover; 
      display: block; transition: var(--transition); 
    }
    .gallery-item:hover .img-container img { transform: scale(1.05); }

    /* 4. THE TEXT - Always Below */
    .item-info { padding: 0.75rem; flex-grow: 1; display: flex; flex-direction: column; gap: 0.25rem; }
    .item-info h3 { font-size: 0.85rem; line-height: 1.2; font-weight: 600; }
    .item-info p { font-size: 0.7rem; color: var(--text-muted); }

    /* LIGHTBOX STYLES */
    .lightbox {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000; opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease; padding: 1rem;
    }
    .lightbox[aria-hidden="false"] { opacity: 1; pointer-events: auto; }
    .lightbox-close {
      position: absolute; top: 1rem; right: 1rem;
      background: none; border: none; color: white;
      font-size: 2.5rem; cursor: pointer; z-index: 1010;
    }
    .lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(30, 30, 30, 0.75); color: white;
      border: 1px solid #333; width: 44px; height: 44px;
      border-radius: 50%; cursor: pointer; display: flex;
      align-items: center; justify-content: center; z-index: 1020;
    }
    .lightbox-prev { left: 1rem; }
    .lightbox-next { right: 1rem; }

    .lightbox-content {
      max-width: 1000px; width: 100%; background: var(--card-bg);
      border-radius: var(--radius); overflow: hidden;
    }
    .lightbox-content-inner { display: flex; flex-direction: column; transition: opacity 0.2s; }
    .lightbox-content-inner.fade-out { opacity: 0; }
    .lightbox-content img { width: 100%; max-height: 60vh; object-fit: contain; background: #000; }
    .lightbox-meta { padding: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .btn-external {
      align-self: flex-start; text-decoration: none;
      background: var(--accent); color: white;
      padding: 0.6rem 1.2rem; border-radius: 6px; font-size: 0.9rem;
    }

    /* RESPONSIVE OVERRIDES - Keeping Grid Uniform */
    @media (min-width: 576px) {
      body { padding: 2rem; }
      .gallery-grid { gap: 1rem; }
      .item-info h3 { font-size: 1rem; }
      .lightbox-content-inner { flex-direction: row; height: 70vh; }
      .lightbox-content img { width: 65%; max-height: 100%; }
      .lightbox-meta { width: 35%; justify-content: center; }
    }

    @media (min-width: 992px) {
      .gallery-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

  <div class="gallery-container">
    <header class="gallery-header">
      <h2>Interactive Showroom Grid</h2>
      <div id="filter-group" class="filter-group">
        <label class="filter-chip">
          <input type="checkbox" value="all" id="filter-all" checked>
          <span>All Windows</span>
        </label>
      </div>
    </header>
    <main id="gallery-grid" class="gallery-grid"></main>
  </div>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lightbox-close">&times;</button>
    <button class="lightbox-nav lightbox-prev">&#10094;</button>
    <button class="lightbox-nav lightbox-next">&#10095;</button>
    <div class="lightbox-content">
      <div id="lightbox-inner" class="lightbox-content-inner">
        <img id="lightbox-img" src="" alt="">
        <div class="lightbox-meta">
          <h3 id="lightbox-title"></h3>
          <p id="lightbox-desc"></p>
          <a id="lightbox-external" href="#" target="_blank" class="btn-external">Open Full Image &nearr;</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let galleryData = [];
      let filteredData = [];
      let currentIdx = 0;
      
      const grid = document.getElementById('gallery-grid');
      const filterGroup = document.getElementById('filter-group');
      const lightbox = document.getElementById('lightbox');
      const lightboxInner = document.getElementById('lightbox-inner');
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxTitle = document.getElementById('lightbox-title');
      const lightboxDesc = document.getElementById('lightbox-desc');
      const lightboxLink = document.getElementById('lightbox-external');
      
      const cloudName = "boxcleversashwindows"; 
      const baseDeliveryUrl = `https://res.cloudinary.com/${cloudName}/image/upload/f_auto,q_auto/`;

      fetch('gallery.json')
        .then(res => res.json())
        .then(data => {
          galleryData = data.resources.map(resource => {
            const fileName = resource.public_id.split('/').pop();
            return {
              id: resource.asset_id,
              title: fileName.replace(/_/g, ' '),
              tags: [fileName.split('_')[0] || 'general'],
              src: `${baseDeliveryUrl}v${resource.version}/${resource.public_id}.${resource.format}`,
              description: `Original Scale: ${resource.width}px × ${resource.height}px`
            };
          });

          filteredData = [...galleryData];
          renderGalleryGrid(filteredData);
          generateDynamicFilters(galleryData);
          setupMultiCheckboxListeners();
        });

      function renderGalleryGrid(items) {
        grid.innerHTML = items.map(item => `
          <div class="gallery-item" data-id="${item.id}">
            <div class="img-container">
              <img src="${item.src}" alt="${item.title}" loading="lazy">
            </div>
            <div class="item-info">
              <h3>${item.title}</h3>
              <p>${item.description}</p>
            </div>
          </div>
        `).join('');

        grid.querySelectorAll('.gallery-item').forEach(card => {
          card.addEventListener('click', () => {
            const id = card.getAttribute('data-id');
            currentIdx = filteredData.findIndex(p => p.id === id);
            openLightbox(filteredData[currentIdx]);
          });
        });
      }

      function generateDynamicFilters(items) {
        const allTags = new Set();
        items.forEach(item => item.tags.forEach(tag => allTags.add(tag)));
        allTags.forEach(tag => {
          const label = document.createElement('label');
          label.className = 'filter-chip';
          label.innerHTML = `<input type="checkbox" class="tag-checkbox" value="${tag}"><span>${tag}</span>`;
          filterGroup.appendChild(label);
        });
      }

      function setupMultiCheckboxListeners() {
        filterGroup.addEventListener('change', (e) => {
          const allCheckbox = document.getElementById('filter-all');
          const tagCheckboxes = document.querySelectorAll('.tag-checkbox');
          
          if (e.target === allCheckbox && allCheckbox.checked) {
            tagCheckboxes.forEach(cb => cb.checked = false);
          } else if (e.target.classList.contains('tag-checkbox')) {
            allCheckbox.checked = false;
          }

          const activeTags = Array.from(tagCheckboxes).filter(cb => cb.checked).map(cb => cb.value);
          filteredData = activeTags.length ? galleryData.filter(item => item.tags.some(t => activeTags.includes(t))) : [...galleryData];
          if (!activeTags.length) allCheckbox.checked = true;
          renderGalleryGrid(filteredData);
        });
      }

      function openLightbox(item) {
        lightboxImg.src = item.src;
        lightboxTitle.textContent = item.title;
        lightboxDesc.textContent = item.description;
        lightboxLink.href = item.src;
        lightbox.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }

      document.querySelector('.lightbox-close').onclick = () => {
        lightbox.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      };
    });
  </script>
</body>
</html>
